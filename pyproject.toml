[project]
name = "multi-agent-code-repair"
version = "0.1.0"
description = "LangGraph-based GitHub issue to validated PR orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain-core>=0.3.0",
  "litellm>=1.40.0",
  "PyGithub>=2.3.0",
  "pydantic>=2.7.0",
  "docker>=7.0.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-python>=0.21.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
  "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-docker>=3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE"]
ignore = ["E501"]
