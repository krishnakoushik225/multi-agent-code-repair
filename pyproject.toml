[project]
name = "multi-agent-code-repair"
version = "0.1.0"
description = "LangGraph-based GitHub issue to validated PR orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain-core>=0.3.0",
  "litellm>=1.40.0",
  "PyGithub>=2.3.0",
  "pydantic>=2.7.0",
  "docker>=7.0.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-python>=0.21.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
  "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-docker>=3.0.0",
  "mypy>=1.10.0",
  "ruff>=0.4.0",
]

[tool.setuptools]
py-modules = ["logging_config", "main"]

[tool.setuptools.packages.find]
include = ["graph*", "nodes*", "tools*", "prompts*", "evaluation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
strict = false
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["."]
omit = [
  "tests/*",
  "evaluation/*",
  "docker/*",
  "main.py",                  # CLI entrypoint — no unit-testable logic
  "tools/github_tools.py",    # requires live GitHub API
  "tools/docker_sandbox.py",  # requires live Docker daemon
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE"]
ignore = ["E501"]
